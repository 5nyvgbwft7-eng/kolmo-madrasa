<!doctype html>
<html lang="ky">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Аль-Фуркон · Көлмө медресеси</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@600;700&family=Noto+Sans:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;700&display=swap">
<style>
:root{
  --bg:#f6f0e2;--bg2:#efe6d0;--surface:#fffcf4;--ink:#17231f;--muted:#586862;--accent:#0b5a4c;--accent2:#0f7a67;--gold:#9a6a14;--goldl:#d9a548;--line:#e2d6b8;--mark:#f4d77a;--markink:#17231f;--chip:#efe5ca;--shadow:0 10px 30px rgba(40,30,5,.10);--hero1:#06332c;--hero2:#0d6353;--herotxt:#f8f0dc;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#070f0d;--bg2:#0b1815;--surface:#0f1d19;--ink:#efe8d4;--muted:#a3b3ac;--accent:#63cbb6;--accent2:#7fe0cb;--gold:#e0ad4f;--goldl:#e0ad4f;--line:#1f362f;--mark:#6b5412;--markink:#fff6dc;--chip:#14281f;--shadow:0 10px 30px rgba(0,0,0,.45);--hero1:#04201b;--hero2:#0a4a3e;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#070f0d;--bg2:#0b1815;--surface:#0f1d19;--ink:#efe8d4;--muted:#a3b3ac;--accent:#63cbb6;--accent2:#7fe0cb;--gold:#e0ad4f;--goldl:#e0ad4f;--line:#1f362f;--mark:#6b5412;--markink:#fff6dc;--chip:#14281f;--shadow:0 10px 30px rgba(0,0,0,.45);--hero1:#04201b;--hero2:#0a4a3e;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:17px/1.65 "Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3,.brand b{font-family:"Noto Serif","Iowan Old Style",Palatino,Georgia,"Times New Roman",serif;font-weight:700;line-height:1.2;letter-spacing:-.005em}
a{color:var(--accent)}
.demo{background:#7a520c;color:#fff;font-size:13.5px;text-align:center;padding:7px 14px;line-height:1.35}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1120px;margin:0 auto;padding:10px 18px 0;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);flex:1;min-width:0}
.brand img.logo{width:58px;height:58px;border-radius:50%;display:block;background:#fff;padding:5px;box-sizing:border-box;object-fit:contain;box-shadow:0 2px 12px rgba(0,0,0,.2);flex:none}
.brand b{font-size:21px;display:block}
.brand small{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;color:var(--muted);font:600 13px "Noto Sans",system-ui,sans-serif;padding:8px 12px;cursor:pointer}
.lang button.on{background:var(--accent);color:var(--bg)}
.theme{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.theme svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav{max-width:1120px;margin:0 auto;padding:6px 12px 9px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{white-space:nowrap;text-decoration:none;color:var(--muted);font-size:15px;font-weight:600;padding:8px 13px;border-radius:999px;transition:background .2s,color .2s}
nav a:hover{color:var(--ink)}
nav a.on{background:var(--accent);color:var(--bg)}
main{max-width:1120px;margin:0 auto;padding:0 18px 64px}
.view{display:none}.view.on{display:block}
.view.on>*{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
.view.on>*:nth-child(2){animation-delay:.05s}.view.on>*:nth-child(3){animation-delay:.1s}.view.on>*:nth-child(4){animation-delay:.15s}.view.on>*:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view.on>*{animation:none}}
.hero{position:relative;overflow:hidden;margin:20px 0 0;border-radius:28px;padding:40px 26px 34px;color:var(--herotxt);background:linear-gradient(155deg,var(--hero2) 0%,var(--hero1) 78%);box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;inset:10px;border:1px solid rgba(224,173,79,.5);border-radius:20px;pointer-events:none}
.hero>*{position:relative}
.hero .in{display:grid;gap:26px;align-items:center}
.hero h1{font-size:clamp(30px,7vw,52px);max-width:18ch}
.hero p{margin-top:14px;max-width:48ch;opacity:.93;font-size:18px}
.hero .arch{display:none;width:200px;justify-self:center}
.orn{display:flex;align-items:center;gap:10px;margin:18px 0 0;max-width:260px;color:var(--goldl)}
.orn i{height:1px;flex:1;background:linear-gradient(90deg,transparent,currentColor)}
.orn i:last-child{background:linear-gradient(270deg,transparent,currentColor)}
.orn svg{width:18px;height:18px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font:600 16px "Noto Sans",system-ui,sans-serif;padding:13px 22px;border-radius:14px;background:var(--goldl);color:#1b1405;text-decoration:none;transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
.btn.alt{background:var(--accent);color:var(--bg)}
.btn.wa{background:#25d366;color:#052d16}
.btn.yt{background:#e62117;color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--goldl);color:var(--herotxt)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
h2.t{font-size:clamp(26px,5vw,34px);margin:44px 0 6px}
h2.t::after{content:"";display:block;width:54px;height:3px;border-radius:3px;margin-top:12px;background:linear-gradient(90deg,var(--goldl),transparent)}
.lead{font-size:19px;max-width:62ch;margin-top:14px;color:var(--ink)}
.note{color:var(--muted);font-size:14.5px;margin-top:8px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-top:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow);position:relative;transition:transform .2s}
a.card{display:block;text-decoration:none;color:inherit}
.card:hover{transform:translateY(-3px)}
.card .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--chip);color:var(--gold);margin-bottom:12px}
.card .ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card h3{font-size:21px;margin-bottom:6px}
.card p{color:var(--muted);font-size:16px}
.card .go{display:inline-block;margin-top:12px;font-weight:600;color:var(--accent)}
.hrow{align-items:stretch}
.hb{flex:1;min-width:210px;border:1.5px solid var(--goldl);border-radius:14px;padding:10px 16px 12px;background:rgba(255,255,255,.07);text-align:center}
.hb .bl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--goldl);min-height:14px}
.hb .bt{font:700 20px/1.3 "Noto Serif",Georgia,serif;margin-top:4px;color:var(--herotxt)}
.hb .bd{display:flex;justify-content:center;gap:6px;margin-top:8px}
.hb .bd button{width:7px;height:7px;border-radius:50%;border:0;background:rgba(255,255,255,.35);cursor:pointer;padding:0}
.hb .bd button.on{background:var(--goldl);width:18px;border-radius:5px}
.card.feat{border:2px solid var(--goldl)}
.badge{font-size:11px;font-weight:700;background:var(--gold);color:var(--bg);padding:2px 9px;border-radius:999px;letter-spacing:.04em}
.band{margin-top:44px;border-radius:24px;padding:28px 24px;background:linear-gradient(135deg,var(--hero2),var(--hero1));color:var(--herotxt);display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
.band h3{font-size:24px}.band p{opacity:.9;margin-top:4px;max-width:46ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);font:600 14px "Noto Sans",system-ui,sans-serif;padding:8px 15px;border-radius:999px;cursor:pointer;transition:background .2s}
.chip.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.fw{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-bottom:12px;box-shadow:var(--shadow)}
.fw summary{list-style:none;cursor:pointer;padding:18px 52px 18px 20px;position:relative}
.fw summary::-webkit-details-marker{display:none}
.fw summary::after{content:"+";position:absolute;right:20px;top:16px;font-size:26px;color:var(--gold);line-height:1}
.fw[open] summary::after{content:"–"}
.meta{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--gold)}
.fw h3{font-size:19px;line-height:1.35}
.ans{margin:0 20px;padding:14px 0 20px;border-top:1px solid var(--line)}
mark{background:var(--mark);color:var(--markink);border-radius:3px;padding:0 1px}
.snip{margin-top:6px;color:var(--muted);font-size:15px;line-height:1.5;font-weight:400}
.count{color:var(--muted);font-size:15px;margin:12px 0 14px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:13px 15px;width:100%}
textarea{min-height:150px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
label{display:block;font-weight:600;font-size:14.5px;margin:16px 0 6px}
.form{max-width:640px;margin-top:20px}
.err{color:#c0392b;font-size:14.5px;margin-top:10px;min-height:20px}
.ok{background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:16px;display:none}
.info{display:grid;gap:12px;margin:20px 0;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.info div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.info b{display:block;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--gold);margin-bottom:3px}
.info span{color:var(--muted)}
.ava{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--hero2),var(--hero1));color:var(--herotxt);font:700 28px "Noto Serif",serif;margin-bottom:14px;border:3px solid var(--goldl)}
.empty{padding:28px 18px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:18px}
.warn{margin-top:18px;padding:14px 16px;border-left:4px solid var(--goldl);background:var(--chip);border-radius:0 12px 12px 0;font-size:15.5px}
footer{margin-top:20px;background:linear-gradient(180deg,var(--hero2),var(--hero1));color:var(--herotxt);padding:32px 18px 36px;text-align:center}
footer b{font-family:"Noto Serif",serif;font-size:20px;display:block}
footer p{opacity:.85;font-size:14.5px;margin-top:6px}
footer .links{display:flex;justify-content:center;gap:14px;margin-top:14px;flex-wrap:wrap}
footer a{color:var(--goldl);font-weight:600;text-decoration:none}

.vcat{margin-top:16px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);padding:16px 0 16px}
.vcat .vh{display:flex;align-items:center;gap:12px;padding:0 16px}
.vcat .vh .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--chip);color:var(--accent);flex:none}.vcat .vh .ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8}
.vcat h3{font-size:21px}.vcat .vh p{color:var(--muted);font-size:14.5px;margin-top:2px}
.vrow{display:flex;gap:12px;overflow-x:auto;padding:14px 16px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}.vrow::-webkit-scrollbar{display:none}
.vc{flex:0 0 72%;max-width:280px;scroll-snap-align:start;text-decoration:none;color:var(--ink)}
.vc .th{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:linear-gradient(155deg,var(--hero2),var(--hero1))}
.vc .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vc .th .pl{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(230,33,23,.92);display:grid;place-items:center}
.vc .th .pl svg{width:20px;height:20px;fill:#fff;margin-left:3px}
.vc .vt{margin-top:8px;font-weight:600;font-size:15px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vc .va{font-size:13px;color:var(--muted);margin-top:3px}
.plc{display:flex;align-items:center;gap:12px;margin:14px 16px 0;padding:12px 14px;border-radius:16px;background:linear-gradient(155deg,var(--hero2),var(--hero1));color:#f8f0dc;text-decoration:none}
.plc .pli{width:42px;height:42px;border-radius:12px;background:rgba(230,33,23,.95);display:grid;place-items:center;flex:none}.plc .pli svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2}
.plc .plt{display:flex;flex-direction:column;min-width:0}.plc small{font-size:12px;opacity:.8}.plc b{font-size:15.5px;line-height:1.3}
.plc .plg{margin-left:auto;font-weight:800;font-size:14px;color:#e0ad4f;white-space:nowrap}
.vsoon{margin:14px 16px 4px;padding:14px;border-radius:14px;background:var(--chip);color:var(--muted);font-size:15px}
.vall{display:inline-flex;margin:10px 16px 0;font-weight:700;color:var(--accent);text-decoration:none}
.tcard{padding:14px;text-align:center}.tph{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 20%;border-radius:16px;display:block;background:var(--chip)}
.trole{display:inline-block;margin-top:12px;font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);background:var(--chip);border-radius:999px;padding:4px 12px}.tcard h3{margin-top:8px;font-size:22px}
.bcard .blg{width:96px;height:96px;border-radius:50%;display:block;margin:0 auto 12px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.15)}.bcard h3{text-align:center;font-size:19px;margin-bottom:8px}
.brow{display:flex;gap:10px;justify-content:space-between;padding:8px 0;border-top:1px dashed var(--line);font-size:15.5px}.brow b{color:var(--muted);font-weight:600}.brow span{text-align:right;font-weight:600}.brow a{color:var(--accent);text-decoration:none}
.req{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:6px}.req .bank{background:#111;color:#f4c400;font-weight:800;border-radius:8px;padding:3px 9px;font-size:14px}.req .rn{font-weight:700}.req .rph{font:700 22px "Noto Sans",system-ui,sans-serif;letter-spacing:.02em;color:var(--accent);width:100%}
.cpy{border:1.5px solid var(--accent);background:transparent;color:var(--accent);font:700 14px "Noto Sans",system-ui,sans-serif;border-radius:999px;padding:7px 16px;cursor:pointer}
.chhelp{margin-top:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);padding:16px;box-shadow:var(--shadow)}.chhelp b{display:block;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.chimg{width:100%;border-radius:14px;margin-top:10px;display:block;aspect-ratio:720/493;object-fit:cover}.chhelp p{margin-top:10px;font-size:16.5px;line-height:1.6}
.trust{list-style:none;display:grid;gap:8px;margin:14px 0 6px}.trust li{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-weight:600}.trust li::before{content:"✓";width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--bg);font-weight:800;font-size:13px}
.pcl{cursor:pointer;transition:transform .15s}.pcl:active{transform:scale(.98)}
.pbk{display:inline-block;margin-top:12px;font-weight:700;font-size:14.5px;color:var(--accent);background:var(--chip);border-radius:999px;padding:6px 12px}
.bkf{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:4px 0 6px;padding:12px 14px;border-radius:14px;background:var(--chip);font-size:15.5px}.bkf b{font-size:17px}
.bkf button{margin-left:auto;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font:700 14px "Noto Sans",system-ui,sans-serif;border-radius:999px;padding:7px 14px;cursor:pointer}
.bkd{margin-top:10px;border-radius:16px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.bkd summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 16px;font-weight:700;font-size:16.5px}
.bkd summary::-webkit-details-marker{display:none}
.bkd summary .n{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--gold);background:var(--chip);border-radius:999px;padding:3px 10px;white-space:nowrap}
.bkd summary::after{content:"+";font-size:20px;color:var(--gold);margin-left:4px}.bkd[open] summary::after{content:"–"}
.bkl{list-style:none;counter-reset:b;padding:0 12px 12px;display:grid;gap:8px}
.bkl li{counter-increment:b;display:grid;grid-template-columns:28px 1fr;gap:4px 10px;align-items:start;padding:10px 12px;border-radius:12px;background:var(--chip)}
.bkl li::before{content:counter(b);grid-row:span 2;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--bg);font:700 12.5px "Noto Sans",system-ui,sans-serif}
.bkl .kn{font-weight:600;line-height:1.35}.bkl .an{font-family:"Noto Naskh Arabic","Amiri","Geeza Pro",serif;direction:rtl;text-align:right;font-size:18.5px;line-height:1.6;color:var(--accent)}
.socg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:16px}
.sb{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:700;font-size:16px;text-decoration:none;box-shadow:var(--shadow)}
.sb i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}.sb i svg{width:20px;height:20px}
.sb i.yt{background:#e62117}.sb i.ig{background:linear-gradient(45deg,#f9a825,#d62976 55%,#7b3fe4)}.sb i.fb{background:#1877f2}.sb i.tt{background:#111;box-shadow:inset 0 0 0 1px #444}.sb i.tg{background:#229ed9}.sb i.wa{background:#25d366}
.fhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}.fhead .btn{margin-bottom:8px;padding:11px 18px;font-size:15px}
.arb{font-family:"Noto Naskh Arabic","Amiri","Geeza Pro","Traditional Arabic",serif;direction:rtl;text-align:right;font-size:21px;line-height:2.05;background:var(--chip);border-radius:14px;padding:12px 16px;margin:12px 0;white-space:pre-line;color:var(--ink)}
.kyp{margin:10px 0}
.by{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);color:var(--muted);font-size:15px;line-height:1.55}
.srcl{margin-top:8px;font-size:13px;color:var(--gold);font-weight:700}
.pubd{font-size:13px;font-weight:700;color:var(--gold)}
.docs{margin-top:34px}.docs h3{font-size:22px}
.dl{list-style:none;counter-reset:d;margin-top:12px;display:grid;gap:8px}
.dl li{counter-increment:d;display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-weight:600}
.dl li::before{content:counter(d);flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--bg);font:700 13px "Noto Sans",system-ui,sans-serif}
.info a{color:var(--accent);font-weight:600;text-decoration:none;display:inline-block;margin:2px 14px 2px 0}
@media (min-width:760px){
  .hero{padding:58px 52px 50px}
  .hero .in{grid-template-columns:1fr 220px}
  .hero .arch{display:block}
  .bar{padding-top:14px}
}

var FATWAS=[{"t": "daarat", "ky": "Эркек аял мамилесинен кийин гусул кыла электе суу ичсе арам болбойбу?", "pub": [16, 11, 2025], "b": [{"k": "ky", "x": "Жыныстык катнаштан кийин жуунбастан туруп суу ичсе арам болбойт. Бирок колуну, оозуну чайкап анан ичкени жакшы.", "r": "Пить воду после близости, не совершив гусль, не является харамом. Но лучше сначала сполоснуть руки и рот, а потом пить."}, {"k": "ar", "x": "في الرد: (قوله: بعد غسل يدوفم) أما قبله فلا ينبغي لأنه يصير شاربا للماء المستعمل وهو مكروه تنزيها ويده لاتخلو عن النجاسة فينبغي غسلها ثم يأكل (\"بدائع\")\n(رد المختار 1\\586 ط.دارالسلام)\nفقط والله اعلم"}], "by": ["Жооп жазган: Мурадил уулу Нурлан", "Мутахоссис филь фикх", "«Көлмө» медресеси", "01.06.2025 м. 05.12.1446 х.", "Текшерген: Исмайилов Жигитали устаз, Татиков Рафаил устаз"], "ru": "Не харам ли пить воду до совершения гусля после близости мужчины и женщины?", "byr": ["Ответ написал: Мурадил уулу Нурлан", "Мутахассис по фикху", "Медресе «Көлмө»", "01.06.2025 г. / 05.12.1446 г. по хиджре", "Проверили: устаз Исмайилов Жигитали, устаз Татиков Рафаил"]}, {"t": "namaz", "ky": "Ассаламаллейкум! Мен жаш балам менен намаздарыма жетишпей жатам парздарын окуп койсом болобу? Балам төрт айлык.", "pub": [12, 4], "b": [{"k": "ky", "x": "Парз намаздан мурдагы жана кийинки намаздар бекемделген сүннөт намаздар болуп саналат. Бул намаздарды олуттуу себепсиз таштаган адам күнөөкөр болот. Ошондуктан жетишпей жатам деп эле сүннөт намаздарды таштаганга болбойт. Эгер балаңыз менен алек болуп анча-мынча сүннөт намаздарды окубай калсаңыз кечиримдүү. Бирок окубай таштап коюуну адат кылып алсаңыз күнөөкөр болосуз.", "r": "Намазы, которые читаются перед фарз-намазом и после него, являются подтверждёнными сунна-намазами. Человек, оставляющий эти намазы без уважительной причины, становится грешником. Поэтому нельзя оставлять сунна-намазы только потому, что «не успеваю». Если вы, занимаясь ребёнком, иногда не успеваете прочитать некоторые сунна-намазы, это простительно. Но если вы сделаете привычкой оставлять их, вы станете грешницей."}, {"k": "ar", "x": "في الرد: (قَوْلُهُ وَسُنَّ مُؤَكَّدًا) أَيْ اسْتِنَانًا مُؤَكَّدًا؛ بِمَعْنَى أَنَّهُ طُلِبَ طَلَبًا مُؤَكَّدًا زِيَادَةً عَلَى بَقِيَّةِ النَّوَافِلِ، وَلِهَذَا كَانَتْ السُّنَّةُ الْمُؤَكَّدَةُ قَرِيبَةً مِنْ الْوَاجِبِ فِي لُحُوقِ الْإِثْمِ كَمَا فِي الْبَحْرِ، وَيَسْتَوْجِبُ تَارِكُهَا التَّضْلِيلَ وَاللَّوْمَ كَمَا فِي التَّحْرِيرِ: أَيْ عَلَى سَبِيلِ الْإِصْرَارِ بِلَا عُذْرٍ كَمَا فِي شَرْحِهِ وَقَدَّمْنَا بَقِيَّةَ الْكَلَامِ عَلَى ذَلِكَ فِي سُنَنِ الْوُضُوءِ.\n(الرد المختار 4\\254 باب الوتر والنوافل ط. دار السلام)\nفقط والله اعلم"}], "by": ["Жооп жазган: Мурадил уулу Нурлан", "Мутахоссис филь фикх", "«Көлмө» медресеси", "20.04.2025м 21.10.1446х", "Текшерген: Исмайилов Жигитали устаз, Татиков Рафаил устаз"], "ru": "Ассаламу алейкум! Из-за маленького ребёнка я не успеваю читать свои намазы. Можно ли мне читать только фарзы? Моему ребёнку четыре месяца.", "byr": ["Ответ написал: Мурадил уулу Нурлан", "Мутахассис по фикху", "Медресе «Көлмө»", "20.04.2025 г. / 21.10.1446 г. по хиджре", "Проверили: устаз Исмайилов Жигитали, устаз Татиков Рафаил"]}, {"t": "orozo", "ky": "Мастурбация орозону жараксыз кылабы?", "b": [{"k": "ky", "x": "Шариятта мастубарция кылууга тыюу салынат жана чоң күнөө болуп эсептелет. Ошондой болсо да, орозо учурунда мындай жагымсыз жагдай болушу мүмкүн. Мындай күнөө кылган адамдын уругу чыккан болсо, орозосу бузулат жана ошол күндү толуктоого тийиш. Ал гусул кылууга дагы милдеттүү. Ал эми уругу чыкпаса, орозосу бузулбайт жана гусул кылууга милдеттүү эмес.", "r": "В шариате мастурбация запрещена и считается большим грехом. Тем не менее, во время поста такая неприятная ситуация может случиться. Если у человека, совершившего этот грех, произошло семяизвержение, его пост нарушается, и ему следует возместить этот день. Он также обязан совершить гусль. Если же семяизвержения не произошло, пост не нарушается, и совершать гусль он не обязан."}, {"k": "ar", "x": "في الرد: (قوله: وكذا الاستمناء بالكف) أي في كونه لا يفسد لكن هذا إذا لم ينزل أما إذا أنزل فعليه القضاء كما سيصرح به وهو المختار. (رد المحتار ٢/٣٩٩ ط: سعيد)"}, {"k": "ky", "x": "Эскертүү: Аллахтын элчиси (ага Аллахтын саламы жана салаваты болсун) айткан: «Аллах Таала кыямат күнү жети түрдүү адамга карабайт жана аларды тазалабайт: … Өзүнүн колун никелеген адамды…»", "r": "Напоминание: Посланник Аллаха (мир ему и благословение Аллаха) сказал: «В Судный день Аллах Всевышний не посмотрит на семь категорий людей и не очистит их: … Того, кто «женится» на своей руке…»"}, {"k": "ar", "x": "عن أنس بن مالك رضي الله عنه عن النبي صلى الله عليه وسلم قال: «سبعة لا ينظر الله إليهم يوم القيامة ولا يزكيهم... : الناكح يده...» (تفسير ابن كثير ط: ٣/٢٣٢ مؤسسة الكتب الثقافية)."}], "by": ["Жооп берди: Татиков Абдурахман", "Текшерди: Исмайилов Жигитали"], "ru": "Нарушает ли мастурбация пост?", "byr": ["Ответил: Татиков Абдурахман", "Проверил: Исмайилов Жигитали"]}, {"t": "orozo", "ky": "Кадыр түнү кандай ибадаттарды кылуу сунушталат?", "pub": [14, 3], "b": [{"k": "ky", "x": "Бул түнү эмне кылуу керек? Көпчүлүгү бул түнү уктабаш керек дешет, ошондуктан алар укташпайт. Аны сүйлөшүү жана пайдасыз иштер менен өткөрүшөт. Бул кадыр түн жөнүндө туура эмес түшүнүк. Түнү көбүрөөк намаз, Куран окуп, Аллах Тааланы көп эстеп, зикир-дубаларды көп кылуу керек. Көпчүлүк такыбаалар ушул түнгө жолугушуп калуу үчүн Рамазандын акыркы он күнүн ибадат менен өткөрүшөт. Ошондуктан Аллахтын көбүрөөк сообуна, мээримине, берекесине ээ болуп калуу үчүн Рамазандын акыркы он түнүн, жок дегенде так түндөрүн ибадатта өткөрүүгө аракет кылуу керек.", "r": "Что нужно делать в эту ночь? Многие говорят, что в эту ночь нельзя спать, и поэтому не спят. Они проводят её в разговорах и бесполезных занятиях. Это неверное представление о ночи Кадр. В эту ночь нужно больше совершать намазов, читать Коран, часто поминать Аллаха Всевышнего, больше совершать зикры и дуа. Многие богобоязненные люди проводят последние десять дней Рамадана в поклонении, чтобы застать эту ночь. Поэтому, чтобы удостоиться большей награды Аллаха, Его милости и благодати, нужно стараться проводить в поклонении последние десять ночей Рамадана, а если не получается, то хотя бы нечётные ночи."}], "by": ["Жооп берди: Татиков Абдурахман", "Текшерди: Исмайилов Жигитали"], "ru": "Какие ибадаты рекомендуется совершать в ночь Кадр?", "byr": ["Ответил: Татиков Абдурахман", "Проверил: Исмайилов Жигитали"]}, {"t": "orozo", "ky": "Помада колдонуу орозону бузабы?", "pub": [3, 3], "b": [{"k": "ky", "x": "Эринге помада же башка косметикалык каражат сүйкөө орозону бузбайт. Бирок ооздун ичине кирип кетсе, орозо макрух болот.", "r": "Нанесение помады или другой косметики на губы пост не нарушает. Но если она попадёт внутрь рта, пост становится макрухом (нежелательным)."}], "by": ["Жооп берди: Татиков Абдурахман", "Текшерди: Исмайилов Жигитали"], "ru": "Нарушает ли пост использование помады?", "byr": ["Ответил: Татиков Абдурахман", "Проверил: Исмайилов Жигитали"]}, {"t": "orozo", "ky": "Орозо учурунда тиш жулдурса болобу?", "b": [{"k": "ky", "x": "Орозо учурунда, эгерде зарылдык туулса, анда тишти жулдурууга болот. Бирок кандын тамакка кирип кетүүсүнөн этият болуу керек, болбосо орозо бузулат. Ошондуктан орозо учурунда тиштерди жулдурбаган дурус жана бардык дарылоо процедураларын орозо башталганча бүтүрүп алуу керек.", "r": "Во время поста, если возникла необходимость, зуб можно удалить. Но нужно остерегаться того, чтобы кровь не попала в горло, иначе пост нарушится. Поэтому лучше не удалять зубы во время поста и завершить все лечебные процедуры до начала поста."}, {"k": "ky", "x": "Эгерде тишти жулдурганда, кокусунан кан же дары ашказанга кире турган болсо, орозо бузулат жана кийин казасын тутуп берүү керек, бирок каффара важиб болбойт.", "r": "Если при удалении зуба кровь или лекарство случайно попадёт в желудок, пост нарушается, и впоследствии его нужно возместить, но каффара не становится обязательной."}, {"k": "ar", "x": "ومن قلع ضرسه في رمضان ودخل الدم إلى جوفه في النهار ولونائما فيجب عليه القضاء إلا أن يفرق بعدم أمكان التحرز عنه فيكون كالقلئ الذي عاد بنفسه فليراجع. (رد المحتار ٢/٣٩٦ ط: سعيد)."}], "by": ["Жооп берди: Татиков Абдурахман", "Текшерди: Исмайилов Жигитали"], "ru": "Можно ли удалять зуб во время поста?", "byr": ["Ответил: Татиков Абдурахман", "Проверил: Исмайилов Жигитали"]}, {"t": "orozo", "ky": "Орозо кармаган адамдын курсагын тойгузганга кандай сооп берилет?", "pub": [1, 3], "b": [{"k": "ky", "x": "Рамазан айында орозо кармаган адамдын оозун ачыруу, кичине күнөөлөрдүн кечирилүүсүнө, тозок отунан кутулууга себеп болот. Ооз ачырган адам ошол орозо кармаган адамдын тапкан сообуна да ээ болот жана орозо кармаган адамдын сообунан эч кемитилбейт.", "r": "Разговение держащего пост в месяц Рамадан становится причиной прощения малых грехов и избавления от огня Ада. Тот, кто дал разговеться, получает и награду того, кто держал пост, и от награды держащего пост ничего не убавляется."}, {"k": "ky", "x": "Аллахтын элчиси (ага Аллахтын саламы жана салаваты болсун) айткан: «Бул айда ким орозо кармаган адамдын оозун ачырса, анын кичине күнөөлөрү кечирилет, от азабынан кутулат, орозо кармаган адамдын сообуна ээ болот, ал эми орозо кармаган адамдын сообу эч бир кемибейт». Сахабалар даттанышты: «О, Аллахтын элчиси (ага Аллахтын саламы жана салаваты болсун) биздин ар бирибиздин эле орозо кармаган адамдарга тамак берүүгө мүмкүнчүлүгүбүз жок». Аллахтын элчиси (ага Аллахтын саламы жана салаваты болсун) аларга айтты: «Аллах Таала бул соопко бир курма болсо да берген, же бир жутум суу же сүт болсо да ууртаткан адамды ээ кылат», —— деп жооп берди.", "r": "Посланник Аллаха (мир ему и благословение Аллаха) сказал: «Кто в этом месяце даст разговеться держащему пост, тому будут прощены малые грехи, он избавится от наказания огнём, получит награду держащего пост, а награда держащего пост нисколько не уменьшится». Сподвижники пожаловались: «О Посланник Аллаха (мир ему и благословение Аллаха), не у каждого из нас есть возможность накормить держащих пост». Посланник Аллаха (мир ему и благословение Аллаха) сказал им: «Аллах Всевышний делает обладателем этой награды даже того, кто дал один финик, или напоил глотком воды или молока», — ответил он."}, {"k": "ar", "x": "من فطر فيه صائما كان له مغفرة لذنوبه و عتق رقبته من النار و كان له مثل أجره من غير أن ينقص من أجره شيء، قالوا يا رسول الله صلى الله عليه و سلم ليس كلنا يجد ما نفطر الصائم ، فقال رسول الله صلى الله عليه و سلم: يعطي الله هذا الثواب من فطر صائما على تمرة أو على شربة ماء أو مذقة لبن. (مشكاة المصابيح ج: ١ ص: ١٧٥ ط: رحمانيه)."}, {"k": "ky", "x": "Пайгамбарыбыз (ага Аллахтын саламы жана салаваты болсун) айткан: «Ким орозо кармаган адамга тойгуза тамак берсе, Аллах Таала ага менин көлмөмөн (Каусардан) бир ууртам суу ичирет жана Бейишке кирмейинче, ал чаңкабайт».", "r": "Наш Пророк (мир ему и благословение Аллаха) сказал: «Кто досыта накормит держащего пост, тому Аллах Всевышний даст выпить глоток из моего водоёма (Каусара), и пока он не войдёт в Рай, он не будет испытывать жажды»."}, {"k": "ar", "x": "من أشبع صائما سقاه الله من حوضي شربة لا يظمأ حتى يدخل الجنة. (مشكاة المصابيح ج: ١ ص: ١٧٥ ط: رحمانيه)."}], "by": ["Жооп берди: Татиков Абдурахман", "Текшерди: Исмайилов Жигитали"], "ru": "Какая награда за то, что накормил досыта держащего пост?", "byr": ["Ответил: Татиков Абдурахман", "Проверил: Исмайилов Жигитали"]}, {"t": "orozo", "ky": "Унутуп калып, тамак жеп жиберсе орозо бузулабы?", "pub": [24, 2], "b": [{"k": "ar", "x": "بسم الله الرحمن الرحيم"}, {"k": "ar", "x": "الجواب ومنه الصدق والصواب"}, {"k": "ky", "x": "— Эгерде, орозо кармаган адам оозу бек экенин унутуп калып бир нерсе жеп же ичип ала турган болсо, жеген тамагынын өлчөмүнө, канча жолу жеп алганына карабастан оозу ачылбайт, бирок шарты —— орозо экени эсине түшөөр замат, дароо жеген ичкенин токтотуп жана оозунда жеп жаткан тамакты чыгарып салуу керек.", "r": "— Если держащий пост, забыв о том, что держит пост, что-то съест или выпьет, то независимо от количества съеденного и от того, сколько раз он ел, его пост не нарушается, но при условии —— что как только он вспомнит о посте, он должен сразу же прекратить есть и пить и выплюнуть еду, которая находится у него во рту."}, {"k": "ar", "x": "وإذا أكل أو شرب ناسيا فتذكر أوكان طلع الفجر وهو يأكل ويشرب فقطع الشرب أوألقى اللقمة فصومه تام. (الفتاوى التاتارخانية ٢/٣٧٢ ط: إدارة القرآن)."}, {"k": "ky", "x": "— Эгерде орозо кармаган адам орозо экенин эстеп, бирок оозундагыны жутуп жибере турган болсо, орозосу бузулат жана Рамазандан кийин бир күндү толуктап кармап берет.", "r": "— Если держащий пост вспомнил о посте, но проглотил то, что было у него во рту, его пост нарушается, и после Рамадана он должен возместить один день."}, {"k": "ky", "x": "— Эгерде, орозо кармаган адам тамак жеп жатып орозо экенин эстеп, бирок баары бир оозум ачылды деп ойлоп, тамак жешин уланта берсе, анда мындай учурда анын орозосу бузулат жана ал Рамазандан кийин ошол күндүн орозосун толуктап кармап берет, бирок каффарасы важиб болбойт.", "r": "— Если держащий пост, вспомнив во время еды о посте, подумает «всё равно мой пост уже нарушен» и продолжит есть, то в таком случае его пост нарушается, и после Рамадана он возместит пост за этот день, но каффара не становится обязательной."}, {"k": "ar", "x": "لوأكل أوشرب أوجامع ناسيا وظن أن ذلك فطره فأكل متعمدا لا كفارة عليه. (الفتاوى الهندية ١/٢٠٦ط: رشيديه)."}, {"k": "ky", "x": "— Эгерде сиз орозо кармаган бир адамдын тамак жеп жатканын көрсөңүз, анда ага сөзсүз орозо экендигин эскертип коюуңуз керек, болбосо күнөө болот. Ал эми эгерде орозо экенин унутуп койгон адам олуттуу оорулуу болсо же алсыз болсо жана ал күн батканча ачкалыкты көтөрө албаса, анда ага орозо экендигин эсине салуу зарыл эмес.", "r": "— Если вы увидите, что держащий пост человек ест, вы обязательно должны напомнить ему о посте, иначе будет грех. А если человек, забывший о посте, серьёзно болен или слаб и не вынесет голода до захода солнца, то напоминать ему о посте не обязательно."}, {"k": "ar", "x": "ويذكره لوقويا وإلا لا ...الخ"}, {"k": "ar", "x": "قوله) أي لزوما كما في الولوالجية فيكره تركه تحريما (بحر قوله لوقويا أي له)"}, {"k": "ar", "x": "قوة على إتمام الصوم بلا ضعف وإذا كان يضعف بالصوم ولو أكل يتقوى على سائر الطاعة يسعه أن لا يخبره فتحفظ. (رد المحتار٢/٣٩٥ ط: سعيد)."}, {"k": "ky", "x": "— Жогоруда айтылган эреже фарз орозого да жана нафил орозого да тиешелүү.", "r": "— Указанное выше правило относится как к обязательному посту (фарз), так и к добровольному (нафль)."}, {"k": "ar", "x": "إذا أكل الصائم أوشرب أوجامع ناسيا لم يفطر ولا فرق بين الفرض والنفل كذا في الهداية. (الفتاوى الهندية ١/٢٠٢ ط: رشيدية)."}, {"k": "ar", "x": "فقط و الله اعلم"}], "by": ["Жооп берди: Татиков Абдурахман", "Текшерди: Исмайилов Жигитали"], "ru": "Нарушается ли пост, если по забывчивости что-то съел?", "byr": ["Ответил: Татиков Абдурахман", "Проверил: Исмайилов Жигитали"]}, {"t": "orozo", "ky": "Экинчи, төртүнчү күндөрү карыз болгон орозолорду кармасак болобу? Биринчи, төртүнчү күндөрү карыз орозосун кармаса болобу же сүннөт орозо кармап, башка күнү карызды кармаш керекпи?", "pub": [1, 12, 2025], "b": [{"k": "ar", "x": "بسم الله الرحمن الرحيم"}, {"k": "ar", "x": "الجواب حامدا ومصليا"}, {"k": "ky", "x": "Каза болуп калган орозону экинчи, төртүнчү күндөрү кармаса болот. Каза орозону кармоо милдет болгондуктан биринчи, төртүнчү күндөрү нафил орозо кармагандын ордуна каза орозону кармаган жакшыраак. Каза орозону мүмкүнчүлүктүн болушунча тезирээк кармап, толуктап коюу керек. Себепсиз кечиктирүү дурус эмес.", "r": "Пропущенный пост можно возмещать во второй и четвёртый дни. Поскольку возмещение пропущенного поста обязательно, лучше возмещать каза-пост в первый и четвёртый дни, чем держать вместо этого добровольный (нафль) пост. Пропущенный пост нужно возмещать как можно скорее, по мере возможности, и довести до конца. Откладывать без причины нехорошо."}, {"k": "ar", "x": "في الهندية:وَأَنْوَاعُهُ فَرْضٌ وَوَاجِبٌ وَنَفْلٌ. وَالْفَرْضُ نَوْعَانِ: مُعَيَّنٌ كَرَمَضَانَ، وَغَيْرُ مُعَيَّنٍ كَالْكَفَّارَاتِ وَقَضَاءِ رَمَضَانَ، وَالْوَاجِبُ نَوْعَانِ: مُعَيَّنٌ كَالنَّذْرِ الْمُعَيَّنِ، وَغَيْرُ مُعَيَّنٍ كَالنَّذْرِ الْمُطْلَقِ، وَالنَّفَلُ كُلُّهُ نَوْعٌ وَاحِدٌ كَذَا فِي التَّبْيِينِ.\n(الفتاوى الهندية 1\\214 كتاب الصوم ط. دار الكتب العلمية)\nفقط والله اعلم"}], "by": ["Жооп жазган: Мурадил уулу Нурлан", "Мутахоссис филь фикх", "«Көлмө» медресеси", "26.05.2025м 28.11.1446х", "Текшерген: Исмайилов Жигитали устаз, Татиков Рафаил устаз"], "ru": "Можно ли возмещать пропущенные посты во второй и четвёртый дни? Можно ли держать пропущенный пост в первый и четвёртый дни, или нужно держать сунна-пост, а долг возмещать в другой день?", "byr": ["Ответ написал: Мурадил уулу Нурлан", "Мутахассис по фикху", "Медресе «Көлмө»", "26.05.2025 г. / 28.11.1446 г. по хиджре", "Проверили: устаз Исмайилов Жигитали, устаз Татиков Рафаил"]}, {"t": "daarat", "ky": "Ассаламу алейкум ва рахматулоху ва баракатух! Даарат алып жатканда башка масх тартканды унутуп коюп, намаз окуп бүткөндөн кийин эстесе, намаз жарайбы?", "pub": [27, 11, 2025], "b": [{"k": "ar", "x": "بسم الله الرحمن الرحيم"}, {"k": "ar", "x": "الجواب حامدا ومصليا"}, {"k": "ky", "x": "Эгер даарат алып жатканда башка масх кылууну унутуп калып, намаз окуп бүткөндөн кийин эстеген болсо, окуган намазы жараксыз болот. Эгер дааратын бузбаган болсо, башына масх тартып намазын кайталап окуйт.", "r": "Если при омовении человек забыл совершить масх головы и вспомнил об этом после завершения намаза, то совершённый им намаз недействителен. Если омовение у него не нарушено, он должен совершить масх головы и повторить намаз."}, {"k": "ar", "x": "في الرد: (أركان الوضوء أربعة)(ومسح ربع الرأس)..... مرة\n(رد المختار 1\\309 327\\ الوضوء وأحكامه ط. دار السلام)\nفقط والله اعلم"}], "by": ["Жооп жазган: Мурадил уулу Нурлан", "Мутахоссис филь фикх", "«Көлмө» медресеси", "25.05.2025м 27.11.1446х", "Текшерген: Исмайилов Жигитали устаз, Татиков Рафаил устаз"], "ru": "Ассаламу алейкум ва рахматулоху ва баракатух! Если при омовении (даарат) забыл совершить масх головы и вспомнил об этом после завершения намаза, действителен ли намаз?", "byr": ["Ответ написал: Мурадил уулу Нурлан", "Мутахассис по фикху", "Медресе «Көлмө»", "25.05.2025 г. / 27.11.1446 г. по хиджре", "Проверили: устаз Исмайилов Жигитали, устаз Татиков Рафаил"]}, {"t": "family", "ky": "Ассаламу алейкум! Менин күйөөм иштебейт, бирок экинчи аял алам дей берет. Аял киши эркекти багуу керек дейт. Менин көзүмчө чоочун аялдар менен сүйлөшө берет. Кандай кылсам болот?", "ru": "Ассаламу алейкум! Мой муж не работает, но постоянно говорит, что возьмёт вторую жену. Говорит, что жена должна содержать мужчину. При мне он разговаривает с чужими женщинами. Как мне быть?", "b": [{"k": "ar", "x": "بسم الله الرحمن الرحيم"}, {"k": "ar", "x": "الجواب حامدا ومصليا"}, {"k": "ky", "x": "Эркек адам үй-бүлөсүн колунан келишинче тамак-аш, кийим-кече, турак-жай менен камсыз кылууга милдеттүү. Эгер үй-бүлөсүн багуу үчүн өзү иштебей аялын иштетсе күнөөкөр болот. Эки аялдын ортосунда адилеттүүлүк кыла албаган, тамак-аш, кийим-кече менен камсыз кыла албаган эркекке экинчи аял алганга болбойт. Эркек киши чоочун аялдар менен заарылдык болбогон учурда сүлөшкөнгө болбойт. Эгер күйөөңүз сиз айткандай кыла берсе, анда күйөөңүздүн ата-энесине жана өзүңүздүн ата-энеңизге айтып, маселени кеңешип чечкениңиздер жакшы.", "r": "Мужчина обязан, насколько ему по силам, обеспечивать свою семью едой, одеждой и жильём. Если он сам не работает, а заставляет работать жену, чтобы содержать семью, он становится грешником. Мужчине, который не может соблюдать справедливость между двумя жёнами и не может обеспечить их едой и одеждой, нельзя брать вторую жену. Мужчине нельзя разговаривать с чужими женщинами без необходимости. Если ваш муж и дальше будет поступать так, как вы описали, то лучше рассказать об этом его родителям и вашим родителям и решить вопрос, посоветовавшись."}], "by": ["Жооп жазган: Мурадил уулу Нурлан", "Мутахоссис филь фикх", "«Көлмө» медресеси", "19.04.2025м 20.10.1446х", "Текшерген: Исмайилов Жигитали устаз, Татиков Абдурахман устаз"], "byr": ["Ответ написал: Мурадил уулу Нурлан", "Мутахассис по фикху", "Медресе «Көлмө»", "19.04.2025 г. / 20.10.1446 г. по хиджре", "Проверили: устаз Исмайилов Жигитали, устаз Татиков Абдурахман"], "pub": [3, 9, 2025]}, {"t": "quran", "ky": "Ассалааму алейкум! Адам жаңы каза болгондо сурагы жеңил болсун, акырет азабы жеңил болсун деп кандай сүрөөлөрдү окуса болот?", "ru": "Ассаляму алейкум! Какие суры можно читать, когда человек только что умер, чтобы его допрос был лёгким и наказание в ахирате было лёгким?", "b": [{"k": "ar", "x": "بسم الله الرحمن الرحيم"}, {"k": "ar", "x": "الجواب حامدا ومصليا"}, {"k": "ky", "x": "Сиз кайсы сүрөлөрдү билсеңиз, ошолорду окуп дуба кылсаңыз болот М: Фатиха, Бакара сүрөсүнүн башкы беш аятын, Аяталь курси, Ааманар росул, Ясин, Мүлк сүрөлөрүн же Такаассур жана Ихлас сүрөсүн 12, 11, 7, 3 жолудан окуп сообун каза болгон адамга багыштап, Аллах Тааладан каза болгон адамдын күнөөлөрүн кечириштигин, сурагын жеңил кылыштыгын жана акыретте азапка салбаштыгын сурап дуба кылсаңыз болот. Хадисте келген: «Ким көрүстөнгө кирип «Ясин» сүрөсүн окуса, Аллах Таала ошол күнү көрүстөндөгүлөргө жеңилдик кылат жана окуган кишиге көрүстөнгө канча киши коюлган болсо ошончо сооп берет.", "r": "Можете читать те суры, которые знаете, и делать дуа. Например: Фатиха, первые пять аятов суры Бакара, Аят аль-Курси, «Аамана-р-расулю», суры Ясин, Мульк или суры Такасур и Ихлас по 12, 11, 7, 3 раза, посвящая награду умершему, и делать дуа, прося Аллаха Всевышнего простить грехи умершего, облегчить его допрос и не подвергать его наказанию в ахирате. В хадисе сказано: «Кто придёт на кладбище и прочитает суру «Ясин», Аллах Всевышний в тот день облегчит участь находящихся на кладбище, а прочитавшему даст награду по числу похороненных на кладбище»."}], "by": ["Жооп жазган: Мурадил уулу Нурлан", "Мутахоссис филь фикх", "«Көлмө» медресеси", "13.04.2025м 14.10.1446х"], "byr": ["Ответ написал: Мурадил уулу Нурлан", "Мутахассис по фикху", "Медресе «Көлмө»", "13.04.2025 г. / 14.10.1446 г. по хиджре"], "pub": [15, 7, 2025]}, {"t": "quran", "ky": "Курани Каримди жаттабаган адам аркы дүйнөдө бейишке кире алабы?", "ru": "Сможет ли человек, не выучивший Священный Коран наизусть, войти в Рай в вечной жизни?", "b": [{"k": "ar", "x": "بسم الله الرحمن الرحيم"}, {"k": "ar", "x": "الجواب حامدا ومصليا"}, {"k": "ky", "x": "Бейишке киргизүү Аллах Тааланын ыктыярындагы нерсе. Аллах Таала кимди кааласа өз рахматына алып, бейишке киргизет; кимди кааласа киргизбейт. Курани Каримди башынан аягына чейин толук жаттоо— фарз кифая. Бир мусулман адам толук жаттаган болсо, башкалар да жоопкерчиликтен кутулат. Ал эми ар бир мусулман Курани Каримди толук жаттоосу сүннөт. Бирок ар бир балагатка жеткен, акылдуу мусулманга намаз окууга жетиштүү болгончолук, жок дегенде Фатиха сүрөөсүн жана бир кыска сүрөө же кыска үч аят жаттоо зарыл. Жаттабаган адам чоң күнөөкөр болот.", "r": "Введение в Рай — во власти Аллаха Всевышнего. Аллах Всевышний, кого пожелает, по Своей милости вводит в Рай, а кого пожелает — не вводит. Выучить Священный Коран наизусть полностью, от начала до конца, — фарз-кифая. Если один мусульманин выучил его полностью, то и с остальных снимается ответственность. А для каждого мусульманина полностью выучить Священный Коран — сунна. Но каждому совершеннолетнему, разумному мусульманину необходимо выучить столько, сколько достаточно для намаза: хотя бы суру Фатиха и одну короткую суру или три коротких аята. Тот, кто не выучил, становится большим грешником."}, {"k": "ar", "x": "فقط والله اعلم"}], "by": ["Жооп жазган: Мурадил уулу Нурлан", "Мутахоссис филь фикх", "«Көлмө» медресеси", "24.05.2025м 26.11.1446х", "Текшерген: Исмайилов Жигитали устаз, Татиков Рафаил устаз"], "byr": ["Ответ написал: Мурадил уулу Нурлан", "Мутахассис по фикху", "Медресе «Көлмө»", "24.05.2025 г. / 26.11.1446 г. по хиджре", "Проверили: устаз Исмайилов Жигитали, устаз Татиков Рафаил"], "pub": [6, 7, 2025]}, {"t": "zekat", "ky": "Битир-садакага канча сом беришибиз керек?", "ru": "Сколько сомов нам нужно давать в качестве битир-садаки?", "b": [{"k": "ky", "x": "Кыргызстан мусулмандар дин башкармалыгы бекиткен 2024-жылдагы битир-садаканын өлчөмү: Быйыл битир-садака ар бир адамга 1,6 кг буудай (50 сом), мейиз (680 сом), ун (75 сом) же 3,2 кг арпа (85 сом), курма (850 сом) түздү.", "r": "Размер битир-садаки на 2024 год, утверждённый Духовным управлением мусульман Кыргызстана: в этом году битир-садака на каждого человека составила 1,6 кг пшеницы (50 сомов), изюм (680 сомов), мука (75 сомов) или 3,2 кг ячменя (85 сомов), финики (850 сомов)."}], "by": ["Жооп берди: Татиков Абдурахман", "Текшерди: Исмайилов Жигитали"], "byr": ["Ответил: Татиков Абдурахман", "Проверил: Исмайилов Жигитали"], "pub": [29, 3, 2025]}, {"t": "orozo", "ky": "Мурунга суу кирип кетсе, ооз ачылабы?", "ru": "Нарушается ли пост, если вода попала в нос?", "b": [{"k": "ky", "x": "Орозо учурунда гусул же даарат алып жатып, ооз-мурунду чайкаганда суунун тамакка кирип кетүүсүнөн этият болуш керек. Мурунду чайкап жатканда суу тамакка кирип кете турган болсо, орозо бузулат жана казасын кармап берүү керек. Бирок орозо кармаган адам орозо экенин билип турса. Ал эми орозо экени эсинен чыгып кетсе, анда орозосу бузулбайт.", "r": "Во время поста, совершая гусль или омовение, при полоскании рта и носа нужно остерегаться, чтобы вода не попала в горло. Если при промывании носа вода попадёт в горло, пост нарушается, и его нужно возместить. Но это так, если держащий пост помнил о том, что постится. А если он забыл о посте, то его пост не нарушается."}, {"k": "ar", "x": "(قوله فسبقه الماء) أي يفسد صومه إن كان ذاكرا له وإلا فلا لأنه لو شرب حينئذ لم يفسد فهذا أولى... إلخ (رد المحتار ٢/٤٠١ ط: سعيد)."}], "by": ["Жооп берди: Татиков Абдурахман", "Текшерди: Исмайилов Жигитали"], "byr": ["Ответил: Татиков Абдурахман", "Проверил: Исмайилов Жигитали"], "pub": [27, 3, 2025]}, {"t": "orozo", "ky": "Маркум ата-энем үчүн орозо кармап берсем болобу?", "ru": "Можно ли мне держать пост за моих покойных родителей?", "b": [{"k": "ky", "x": "Башка бирөө үчүн (тирүү же өлгөн) орозо кармоого уруксат берилбейт. Ошондуктан адамдын башка бирөө үчүн кармаган орозосу кармаган адамына эсептелбейт, анын моюнан каза орозолор алынбайт. Бирок кармаган орозосунун сообун ал адамга багыштаса болот.", "r": "Держать пост за другого человека (живого или умершего) не разрешается. Поэтому пост, который человек держит за другого, тому не засчитывается, и с него не снимаются пропущенные посты. Но награду за свой пост можно посвятить этому человеку."}, {"k": "ar", "x": "لما روي عن ابن عمر مرفوعا إلى رسول الله صلى الله عليه وسلم أنه قال: «لا يصومن أحد عن أحد ويصلين أحد عن أحد». (بدائع الصنائع ٢/١٠٣ ط: دار الكتاب العلمية)."}], "by": ["Жооп берди: Татиков Абдурахман", "Текшерди: Исмайилов Жигитали"], "byr": ["Ответил: Татиков Абдурахман", "Проверил: Исмайилов Жигитали"], "pub": [24, 3, 2025]}, {"t": "orozo", "ky": "Сөзсүз саарлык кылыш керекпи? Кечинде ниет кылып эле ооз бекитип койсо, кандай болот?", "ru": "Обязательно ли совершать сухур? Что будет, если сделать намерение вечером и просто начать пост?", "b": [{"k": "ky", "x": "Сухур (саарлык) —— бул субх ас-садык убактысына чейинки, таң атаардагы тамактануу.", "r": "Сухур (саарлык) —— это приём пищи перед рассветом, до наступления времени субх ас-садык."}, {"k": "ar", "x": "السحور ما يؤكل في السحور وهو السدس الأخير من الليل. (البحر الرائق ٢/٥١١ ط: دار الكتب العلمية)."}, {"k": "ky", "x": "Орозо кармоочу адам ачка болбосо да, сүннөткө амал кылуу максатында бир курма болсо да жеп, бир жутум суу болсо да уурттап коюу керек. Аллахтын элчиси (ага Аллахтын саламы жана салаваты болсун) айткан: «Бир ууртам суу менен болсо да, саарлык кылгыла».", "r": "Даже если держащий пост не голоден, ради следования сунне ему следует съесть хотя бы один финик или сделать хотя бы глоток воды. Посланник Аллаха (мир ему и благословение Аллаха) сказал: «Совершайте сухур хотя бы глотком воды»."}, {"k": "ar", "x": "عن عبد الله بن عمر قال: قال رسول الله صلى الله عليه وسلم: «تسحروا ولو بجرعة من ماء». (رواه ابن حبان في صحيحه رقم: ٣٤٦٧ )."}, {"k": "ar", "x": "تسحروا ولو بجرعة من ماء (ع عن أنس). (كنز العمال: رقم الحديث ٢٣٩٦٨ ط: بيروت)."}], "by": ["Жооп берди: Татиков Абдурахман", "Текшерди: Исмайилов Жигитали"], "byr": ["Ответил: Татиков Абдурахман", "Проверил: Исмайилов Жигитали"], "pub": [23, 3, 2025]}, {"t": "orozo", "ky": "Жүйөлүү себепсиз оозун ачып алган адам эмне кылыш керек?", "ru": "Что должен сделать человек, нарушивший пост без уважительной причины?", "b": [{"k": "ky", "x": "Адам ниет кылып орозо кармап, бирок Рамазан учурунда аны бузса – жеп-ичсе, же аялы менен жыныстык катнаш кылса, ал бир күн казасын кармоого жана каффарасын аткарууга милдеттүү.", "r": "Если человек, сделав намерение, держал пост, но во время Рамадана нарушил его — поел или попил, либо вступил в близость с женой, то он обязан возместить один день и выполнить каффару."}, {"k": "ar", "x": "إذا فعل الصائم شيئا منها طائعا متعمدا غير مضطر لزمه القضا والكفارة وهي الجماع في أحد السبيلين على الفاعل والمفعول به والأكل والشرب سواء ما يتغذى به أو يتداوى به. (مراقي الفلاح ص:٢٤١ ط: سعيد)."}, {"k": "ky", "x": "Каффара —— бул орозону атайын бузгандыгына берилүүчү жаза. Орозосун атайылап бузган адам андан кутулуу үчүн эки ай үзгүлтүксүз орозо кармап берүүгө милдеттүү. Эгер туткан орозосун бир эле күнгө үзгүлтүккө учурата турган болсо, кайра башынан эсептеп, алтымыш күн кармайт. Эгерде адам кандайдыр бир жүйөөлүү себептер менен орозо кармап бере албай турган болсо, анда ал алтымыш жакыр адамды тамактандырууга милдеттүү.", "r": "Каффара —— это наказание за умышленное нарушение поста. Человек, умышленно нарушивший пост, чтобы искупить это, обязан держать пост два месяца подряд без перерыва. Если он прервёт свой пост хотя бы на один день, то начинает отсчёт заново и держит шестьдесят дней. Если же человек по каким-либо уважительным причинам не может держать пост, то он обязан накормить шестьдесят бедняков."}, {"k": "ar", "x": "(قوله وكفر... ككفارة المظاهر) مرتبط بقوله وكفر أي مثله في الترتيب فيعتق أولا فإن لم يجد صام شهرين متتابعين فإن لم يستطيع أطعم ستين مسكين. (رد المحتار ٢/٤١٢ ط: سعيد)."}, {"k": "ar", "x": "(فإن لم يستطع الصوم) لمرض أو كبر (أطعم ستين مسكينا). (حاشية الطحطاوي على مراقي االفلاح ص:٦٧٠ ط: دار الكتب العلمية)."}], "by": ["Жооп берди: Татиков Абдурахман", "Текшерди: Исмайилов Жигитали"], "byr": ["Ответил: Татиков Абдурахман", "Проверил: Исмайилов Жигитали"]}, {"t": "orozo", "ky": "Тамеки чексе, ооз ачылабы?", "ru": "Нарушается ли пост, если курить?", "b": [{"k": "ky", "x": "Рамазан айында тамеки тартуу орозону бузат. Анткени орозо кармаган адам түтүндү атайылап жыттап (жутуп) жатат, буга тыюу салынган.", "r": "Курение в месяц Рамадан нарушает пост. Потому что держащий пост намеренно вдыхает (вбирает в себя) дым, а это запрещено."}, {"k": "ky", "x": "Эгер орозо кармаган адам бир жолу болсо да тамекинин түтүнүн атайлап жыттаса жана түтүн алкымына кирип кетсе, орозосу бузулат жана бир күндү сөзсүз толуктап кармап берүү керек.", "r": "Если держащий пост хотя бы один раз намеренно вдохнул табачный дым и дым попал в горло, его пост нарушается, и он обязательно должен возместить один день."}], "by": ["Жооп берди: Татиков Абдурахман", "Текшерди: Исмайилов Жигитали"], "byr": ["Ответил: Татиков Абдурахман", "Проверил: Исмайилов Жигитали"], "pub": [2, 3, 2025]}, {"t": "orozo", "ky": "Жумуш оор болсо, орозо тутпай коюуга уруксатпы?", "ru": "Разрешается ли не держать пост, если работа тяжёлая?", "b": [{"k": "ky", "x": "— Жумуштун себебинен орозону калтырууга уруксат берилбейт.", "r": "— Оставлять пост из-за работы не разрешается."}, {"k": "ky", "x": "— Орозо учурунда жумушта орозо кармоого күчү жетпей кала тургандай өзүн өтө чаалыктыра иштөөгө болбойт. Эгерде, жумуш оор болсо, жарым күн иштеп жарым күн эс алууга болот.", "r": "— Во время поста нельзя изнурять себя на работе так, чтобы не хватило сил держать пост. Если работа тяжёлая, можно половину дня работать, а половину дня отдыхать."}, {"k": "ar", "x": "لا يجوز أن يعمل عملا يصل به الى الضعف فيخبز نصف النهار و يستريح الباقي. (رد المختار ٢/٤٢٠ ط: سعيد)."}, {"k": "ky", "x": "Эскертүү: Эгерде, иши кара күч жумшоо менен коштоло турган болсо, анда Рамазан учурунда эмгек өргүүсүнө чыгып алуусу дурус.", "r": "Примечание: если работа связана с тяжёлым физическим трудом, то во время Рамадана лучше взять трудовой отпуск."}], "by": ["Жооп берди: Татиков Абдурахман", "Текшерди: Исмайилов Жигитали"], "byr": ["Ответил: Татиков Абдурахман", "Проверил: Исмайилов Жигитали"]}, {"t": "namaz", "ky": "Намаз окуп жаткан учурда, алдынан бирөө өтсө, намаз бузулабы?", "ru": "Нарушается ли намаз, если кто-то проходит перед молящимся?", "b": [{"k": "ky", "x": "Намаз окуп жаткан адамдын алдынан өткөн учурда, намазы бузулбайт. Бирок, алдынан өткөн адам, күнөөкөр болот.", "r": "Если кто-то проходит перед совершающим намаз, его намаз не нарушается. Но тот, кто прошёл перед ним, становится грешником."}, {"k": "ky", "x": "Ошондой эле, намаз окуучу адам, элдер өткөн жерде намаз окубастан, четирээк жерде окусун.", "r": "Также совершающему намаз следует молиться не там, где проходят люди, а в стороне."}], "by": ["Жооп берди: Зайнидин уулу Дооронбек.", "Текшерди: Исмаилов Жигитали."], "byr": ["Ответил: Зайнидин уулу Дооронбек.", "Проверил: Исмаилов Жигитали."], "pub": [19, 7, 2024]}, {"t": "namaz", "ky": "Жеңи кыска көйнөк же футболка менен намаз окуса, макрух болобу? Атайлап көйнөктүн жеңин түрсө, макрух деп укканмын, ушул туурабы?", "ru": "Является ли макрухом намаз в рубашке с коротким рукавом или футболке? Я слышал, что если намеренно закатать рукава рубашки, это макрух, верно ли это?", "b": [{"k": "ky", "x": "Намазда жеңи кийим менен окуса боло берет. Бирок, мындай абалда намаз окуу, Пайгамбарыбыздын, саалихиндер ыктыяр кылган эмес, алар узун кийим менен окушкан. Ошондуктан жеңи узун кийим менен окуган жакшы.", "r": "Совершать намаз в такой одежде можно. Но совершать намаз в таком виде не предпочитали ни наш Пророк, ни праведники — они молились в длинной одежде. Поэтому лучше молиться в одежде с длинными рукавами."}, {"k": "ky", "x": "Ооба, жеңи узун кимимдин жеңин даарат алууга же башка нерсе үчүн түрүп алып, анан ошол бойдон намаз окуса макрух болот.", "r": "Да, если закатать рукава одежды с длинными рукавами для омовения или для чего-то другого и затем в таком виде совершить намаз, это будет макрухом."}], "by": ["Жооп берди: Сүйүнбаев Абдурахим.", "Текшерди: Исмаилов Жигитали."], "byr": ["Ответил: Сүйүнбаев Абдурахим.", "Проверил: Исмаилов Жигитали."], "pub": [17, 7, 2024]}, {"t": "family", "ky": "Менин бир таанышым еврейге турмушка чыгып кетиптир, бирок ал ислам динин карманып жүрөт, ошондо алардын никеси кандай болот. Күйөө бала еврей, аял исламда.", "ru": "Одна моя знакомая вышла замуж за еврея, но она придерживается ислама. Каков тогда их брак? Муж — еврей, жена — мусульманка.", "b": [{"k": "ky", "x": "Мусулман аял башка диндеги адамга турмушка чыкса болбойт.", "r": "Мусульманке нельзя выходить замуж за человека другой религии."}, {"k": "ky", "x": "Таанышыңыздын атасы же бир туугандары (махрамдарды) ажыратып алуусу керек.", "r": "Отец или родственники (махрамы) вашей знакомой должны их разлучить."}, {"k": "ky", "x": "Динсиздер тозоко чакырат, ислам дини бейишке чакырат. Мусулман аял, мусулман эркектерден башкага турмушка чыкса болбойт.", "r": "Неверующие зовут к Аду, а ислам зовёт в Рай. Мусульманке нельзя выходить замуж ни за кого, кроме мусульманина."}, {"k": "ky", "x": "Себеби бул никде, мусулман аялдын куфурга өтүү коркунучу бар. Адатта эри өзүнүн динине чакырат. аял киши өзүнүн ишенчээк, мээримдүүлүгү себептен, динде эрин ээрчип, жашап кетүүсү мүмкүн.", "r": "Причина в том, что в таком браке есть опасность перехода мусульманки в куфр (неверие). Обычно муж призывает к своей религии, а женщина из-за своей доверчивости и мягкосердечия может последовать за мужем в религии и так жить."}], "by": ["Жооп берди: Сүйүнбаев Абдурахим.", "Текшерди: Исмаилов Жигитали."], "byr": ["Ответил: Сүйүнбаев Абдурахим.", "Проверил: Исмаилов Жигитали."]}, {"t": "namaz", "ky": "Бир эженин давлениясы бар экен, намазда саждага барса, башы катуу ооруп кетет экен, ошол себептен падушка коюп, ошого сажда кылса болобу?", "ru": "У одной женщины давление: когда в намазе она совершает сажда, у неё сильно болит голова. Можно ли поэтому положить подушку и совершать сажда на неё?", "b": [{"k": "ky", "x": "Эгер башы катуу ооругандыктан сажда кылуу кыйын болсо, олтуруп рүкү жана сажданы ишара кылган абалда намаз окуйт. Сажданы рүкүдөн бираз ылдый кылуусу керек,. Сажда кылуу үчүн жерге бир нерсени коюп, ошонун үтүнө сажда кылса дагы болот, бирок, ошол нерсени сажда кылып жаткан учурда жүзүнө көтөрүүсү болбойт.", "r": "Если из-за сильной головной боли совершать сажда трудно, то она совершает намаз сидя, обозначая руку и сажда знаками. Сажда следует обозначать немного ниже, чем руку. Можно также положить что-то на пол и совершать сажда на это, но нельзя поднимать этот предмет к лицу во время сажда."}], "by": ["Жооп берди: Мурадил уулу Нурлан.", "Текшерди: Исмаилов Жигитали."], "byr": ["Ответил: Мурадил уулу Нурлан.", "Проверил: Исмаилов Жигитали."], "pub": [16, 7, 2024]}, {"t": "adep", "ky": "Саламдашканда эки колдоп бериш керекпи же бир колдоп берсе болобу?", "ru": "Нужно ли при приветствии подавать обе руки или можно подать одну?", "b": [{"k": "ky", "x": "Саламдашканда бир кол менен учурашса болот, эки колдоп учурашуу сүннөт.", "r": "При приветствии можно поздороваться одной рукой, а здороваться двумя руками — сунна."}], "by": ["Жооп берди: Сүйүнбаев Абдурахим.", "Текшерди: Исмаилов Жигитали."], "byr": ["Ответил: Сүйүнбаев Абдурахим.", "Проверил: Исмаилов Жигитали."], "pub": [14, 7, 2024]}, {"t": "namaz", "ky": "Намаз окуп жатканда арт жагында телевизор иштеп турса, намаз өтө береби? Телевизордон чыккан адамдардын, жаныбарлардын сүрөтү намазды жараксыз кылбайбы?", "ru": "Действителен ли намаз, если во время намаза позади работает телевизор? Не делают ли изображения людей и животных в телевизоре намаз недействительным?", "b": [{"k": "ky", "x": "Намаз окуп жатканда, арт жагында телевизор иштеп турса, анда намаз жарактуу болот. Бирок берилгендик менен окууга жолтоо болгондук себептен, телевизор иштеп турганы жакшы эмес.", "r": "Если во время намаза позади работает телевизор, то намаз действителен. Но поскольку это мешает молиться сосредоточенно, нехорошо, когда телевизор работает."}, {"k": "ky", "x": "Ал эми адам жана жаныбардын сүрөттөрү намаз окуучу кишинин алды жагында же сажда кыла турган ордунда, арт жагында болсо намаз жарактуу болот. Бирок, макрух. Эгер олтурган жеринде, буттун астында болсо, макрух эмес.", "r": "Что касается изображений людей и животных: если они находятся перед молящимся, на месте, где он совершает сажда, или позади него, намаз действителен, но это макрух. Если же они находятся там, где он сидит, под ногами, это не макрух."}], "by": ["Жооп берди: Мурадил уулу Нурлан.", "Текшерди: Исмаилов Жигитали."], "byr": ["Ответил: Мурадил уулу Нурлан.", "Проверил: Исмаилов Жигитали."]}, {"t": "family", "ky": "Аял жана эркектин ортосундагы махр кечүү маселеси кандай болот?", "ru": "Как обстоит вопрос с прощением махра между мужем и женой?", "b": [{"k": "ky", "x": "Күйөө бала аялына эң азында 10 дирхам (2150 сом) махр берүүсү важип (милдет). Эгер жубайлардын ортосунда, махр белгиленгенден кийин, аял өз ыктыяры менен махрды кечип жиберсе болот, бирок күйөө бала махр берип койгону жакшы.", "r": "Муж обязан (ваджиб) дать жене махр не менее 10 дирхамов (2150 сомов). Если после того, как между супругами был определён махр, жена по своей воле простит махр, это допустимо, но лучше, чтобы муж всё же отдал махр."}], "by": ["Жооп берди: Мурадил уулу Нурлан.", "Текшерди: Исмаилов Жигитали."], "byr": ["Ответил: Мурадил уулу Нурлан.", "Проверил: Исмаилов Жигитали."], "pub": [10, 7, 2024]}, {"t": "family", "ky": "Аялым менен кайсыл учурда ажырашууга шарият уруксат берет? Аялым талагын сурап жатат, бир кызыбыз бар. Чырдын себеби каржылык жетишсиз.", "ru": "В каких случаях шариат разрешает развестись с женой? Жена просит развода, у нас есть дочь. Причина ссор — нехватка денег.", "b": [{"k": "ky", "x": "Шариятыбыз болушунча ажырашпоого, үй-бүлөнү сактап чоогу жашаганга буюрат.", "r": "Наш шариат велит по возможности не разводиться, а сохранять семью и жить вместе."}, {"k": "ky", "x": "Аялыңызга талак бербейсиз. Сиздин аялыңыз жана кызыңызды тамак-аш, кийим-кече жана турак-жай менен камсыз кылууңуз сиздин милдет болуп саналат. Сиз тапкан акчага аялыңыз канаат кылып жашоосу керек. Аларга сарптоодон сараңдык кылбаңыз.", "r": "Не давайте жене талак. Обеспечение вашей жены и дочери едой, одеждой и жильём является вашей обязанностью. Ваша жена должна жить, довольствуясь тем, что вы зарабатываете. Не скупитесь на расходы на них."}], "by": ["Жооп берди: Сүйүнбаев Абдурахим", "Текшерди: Исмаилов Жигитали."], "byr": ["Ответил: Сүйүнбаев Абдурахим", "Проверил: Исмаилов Жигитали."]}, {"t": "adep", "ky": "Ата-эне сарсана болбосун деп калп айтса болобу? М: Ооруп калып жок мен оорубай элемин деген сыяктуу.", "ru": "Можно ли солгать, чтобы родители не переживали? Например, сказать «нет, я не болею», когда болеешь.", "b": [{"k": "ky", "x": "Аллах Таала ата-энеенин көңүлүн оорутпоого аларга жакшы мамиле жана жумшак сөз сүйлөөгө буюрат. Ошондуктан аларга жакшы мамиле кылуу баланын милдети болуп саналат.", "r": "Аллах Всевышний велит не огорчать родителей, хорошо к ним относиться и говорить с ними мягко. Поэтому хорошее отношение к ним является обязанностью ребёнка."}, {"k": "ky", "x": "Шариятта калп, жалган айтуу харам экени айтылат. Бирок жалган айтыштан башка айласы калбаса анда маъриз жана таурияны колдонуп жооп берет.", "r": "В шариате сказано, что ложь и обман — харам. Но если нет другого выхода, кроме как солгать, то отвечают, используя маариз и таурию (иносказание)."}, {"k": "ky", "x": "Таурия деп, берген жообундагы сөздүн айтылышынын максаты башка, мааниси башка болот. Мисала: Башы ооруп туруп колу менен экинчи колун кармап, бул жерим оорубай эле десе, уккан киши анын оорусу жок экенин түшүнсө, ооруган киши колумда оору жок дегенди айткан болот.", "r": "Таурия — это когда в ответе у сказанного слова одна цель, а смысл другой. Например: если человек, у которого болит голова, возьмёт одной рукой другую руку и скажет: «Вот здесь у меня не болит», то слушающий поймёт, что он здоров, а больной при этом сказал, что у него не болит рука."}], "by": ["Жооп берди: Сүйүнбаев Абдурахим", "Текшерди: Исмаилов Жигитали."], "byr": ["Ответил: Сүйүнбаев Абдурахим", "Проверил: Исмаилов Жигитали."]}, {"t": "namaz", "ky": "Кандай учурларда намазды бузганга уруксат?", "ru": "В каких случаях разрешается прервать намаз?", "b": [{"k": "ky", "x": "Мусулман адам, намазга киришкенден кийин аны аягына чыгарууга милдеттүү болуп, бузганга болбойт. Ал эми жүйөлүү себептер менен намазды бузганга шариятыбыз уруксат берет.", "r": "Мусульманин, начав намаз, обязан довести его до конца, и прерывать его нельзя. Но по уважительным причинам наш шариат разрешает прервать намаз."}, {"k": "ky", "x": "М: Жыланды өлтүрүү, байланган улоосу качып кетүү коркунучу болсо же казандагы тамагы күйүп, жараксыз болуп кала турган учурларда, намазды бузганга уруксат.", "r": "Например: чтобы убить змею, если есть опасность, что привязанное животное убежит, или если еда в казане подгорит и испортится — в таких случаях прервать намаз разрешается."}, {"k": "ky", "x": "Намазды бузгандагы маселеде ар бир намаз окуучу карап корот, эгер ал бишка бироөөнүн жанына кооптулук жетишинен сактап калса, ал намазын бузуу керек, баасы 250 сом жана андан кымбат баалуу буюмду сактап(уурдалуудан же жок болуудан) калса, намазды бузганга уруксат.", "r": "В вопросе прерывания намаза каждый молящийся смотрит сам: если он спасает чью-то жизнь от опасности, он должен прервать свой намаз; если он спасает вещь стоимостью 250 сомов и дороже (от кражи или пропажи), прервать намаз разрешается."}], "by": ["Жооп берди: Юсупов Таалайбек.", "Текшерди: Исмаилов Жигитали."], "byr": ["Ответил: Юсупов Таалайбек.", "Проверил: Исмаилов Жигитали."]}];

function roots(t){
  var seen={},list=[t],fr=[t];seen[t]=1;
  for(var r=0;r<3;r++){
    var nx=[];
    fr.forEach(function(w){SUF.forEach(function(s){
      if(w.length-s.length>=3&&w.slice(-s.length)===s){var x=w.slice(0,w.length-s.length);if(!seen[x]){seen[x]=1;list.push(x);nx.push(x)}}
    })});
    fr=nx;
  }
  return list.sort(function(a,b){return b.length-a.length});
}
function alts(t){
  var out=[t];
  SYN.forEach(function(g){
    var hit=g.some(function(w){return t.indexOf(w)===0||(t.length>=4&&w.indexOf(t)===0)});
    if(hit)g.forEach(function(w){if(out.indexOf(w)<0)out.push(w)});
  });
  return out;
}
// кыска (3 тамгалуу) тамырлар сөздүн башында гана эсептелет (кус → кусуу, бирок тууралуу эмес)
function at(n,r,from){
  var i=from;
  while((i=n.indexOf(r,i))>-1){
    if(r.length>3||i===0||!/[a-zа-я0-9]/.test(n.charAt(i-1)))return i;
    i++;
  }
  return -1;
}
function found(t,n){
  var a=alts(t),best=null;
  for(var i=0;i<a.length;i++){
    var rs=roots(a[i]);
    for(var j=0;j<rs.length;j++){if(at(n,rs[j],0)>-1){if(!best||rs[j].length>best.length)best=rs[j];break}}
  }
  return best;
}
function ranges(s,tk){
  var n=norm(s),r=[];
  tk.forEach(function(t){
    alts(t).forEach(function(a){
      var rs=roots(a);
      for(var j=0;j<rs.length;j++){
        if(at(n,rs[j],0)>-1){var i=0;while((i=at(n,rs[j],i))>-1){r.push([i,i+rs[j].length]);i+=rs[j].length}break}
      }
    });
  });
  if(!r.length)return [];
  r.sort(function(a,b){return a[0]-b[0]});
  var m=[r[0]];
  for(var k=1;k<r.length;k++){var l=m[m.length-1];if(r[k][0]<=l[1])l[1]=Math.max(l[1],r[k][1]);else m.push(r[k])}
  return m;
}
function hl(s,tk){
  var m=ranges(s,tk);if(!m.length)return esc(s);
  var o="",p=0;
  m.forEach(function(x){o+=esc(s.slice(p,x[0]))+"<mark>"+esc(s.slice(x[0],x[1]))+"</mark>";p=x[1]});
  return o+esc(s.slice(p));
}
function tokens(){
  var a=norm($("q").value).split(/[\s,.;:!?()«»"“”]+/).filter(Boolean);
  var b=a.filter(function(w){return w.length>2});
  return b.length?b:a;
}
function qText(f){return f[lang]||f[lang==="ky"?"ru":"ky"]}
function aReal(f,lg){return f["a_"+lg]||""}
function search(tk){
  var out=[];
  FATWAS.forEach(function(f,idx){
    if(topic&&f.t!==topic)return;
    var qn=norm((f.ky||"")+" "+(f.ru||"")+" "+(f.k||"")+" "+T.ky.topics[f.t]+" "+T.ru.topics[f.t]),an=norm(aReal(f,"ky")+" "+aReal(f,"ru"));
    var sc=0,c=0;
    tk.forEach(function(t){
      var mq=found(t,qn),ma=found(t,an);
      if(mq||ma){c++;sc+=(mq?3+mq.length*.1:0)+(ma?1+ma.length*.1:0)}
    });
    if(c)out.push({f:f,c:c,s:sc,i:idx});
  });
  out.sort(function(a,b){return b.c-a.c||b.s-a.s||a.i-b.i});
  var full=out.filter(function(x){return x.c===tk.length});
  return full.length?{list:full,partial:false}:{list:out,partial:out.length>0};
}
function answerHtml(f,tk){
  var d=T[lang],o="";
  f.b.forEach(function(b){
    if(b.k==="ar")o+='<p class="arb" dir="rtl" lang="ar">'+esc(b.x)+'</p>';
    else o+='<p class="kyp">'+hl((lang==="ru"&&b.r)?b.r:b.x,tk)+'</p>';
  });
  o+='<div class="by">'+((lang==="ru"&&f.byr)?f.byr:f.by).map(esc).join("<br>")+(f.pub?'<br>'+esc(pubTxt(f)):'')+'</div>';
  return o;
}
function card(f,tk,open){
  var d=T[lang],ans=aReal(f,lang)||aReal(f,lang==="ky"?"ru":"ky"),snip="";
  if(tk.length&&ans){
    var m=ranges(ans,tk);
    if(m.length){var st=Math.max(0,m[0][0]-70),en=Math.min(ans.length,m[0][0]+140);snip='<p class="snip">'+(st>0?"… ":"")+hl(ans.slice(st,en),tk)+(en<ans.length?" …":"")+'</p>'}
  }
  var pd=pubTxt(f);
  return '<details class="fw"'+(open?" open":"")+'><summary><div class="meta"><span class="tag">'+esc(d.topics[f.t])+'</span>'+(pd?'<span class="pubd">'+esc(pd)+'</span>':'')+'</div><h3>'+hl(qText(f),tk)+'</h3>'+snip+'</summary><div class="ans">'+answerHtml(f,tk)+'</div></details>';
}
function renderFatwas(){
  var d=T[lang],tk=tokens();
  var h='<button type="button" class="chip'+(topic===""?" on":"")+'" data-t="">'+d.f_all+'</button>';
  TOPICS.filter(function(id){return FATWAS.some(function(f){return f.t===id})}).forEach(function(id){h+='<button type="button" class="chip'+(topic===id?" on":"")+'" data-t="'+id+'">'+esc(d.topics[id])+'</button>'});
  $("ftopics").innerHTML=h;
  var res,partial=false;
  if(tk.length){var sr=search(tk);res=sr.list.map(function(x){return x.f});partial=sr.partial}
  else res=FATWAS.filter(function(f){return !topic||f.t===topic});
  $("fcount").textContent=res.length?d.f_found+res.length+(partial?" · "+d.f_part:"")+(lang==="ru"?" · "+d.f_orig:""):"";
  var part=res.slice(0,shown),open=tk.length>0&&res.length<=3;
  $("flist").innerHTML=res.length?part.map(function(f){return card(f,tk,open)}).join(""):'<div class="empty">'+d.f_none+'</div>';
  $("fmore").innerHTML=res.length>shown?'<button type="button" class="btn alt" id="more">'+d.f_more+'</button>':"";
}

  if(bkF!==null){var p=PROGS[bkF];head='<div class="bkf"><b>'+esc(lang==="ky"?p.ky:p.ru)+'</b> · '+esc(d.bk_for)+'<button type="button" id="bkall">'+esc(d.bk_all)+'</button></div>'}
  $("books").innerHTML=head+L.map(function(s,k){return '<details class="bkd"'+(bkF!==null&&k===0?" open":"")+'><summary><span>'+esc(lang==="ru"?s.ru:s.ky)+'</span><span class="n">'+s.b.length+esc(d.bk_n)+'</span></summary><ol class="bkl">'+s.b.map(function(x){return '<li><div class="kn">'+esc(x[0])+'</div>'+(x[1]?'<div class="an" lang="ar">'+esc(x[1])+'</div>':'<div></div>')+'</li>'}).join("")+'</ol></details>'}).join("");
}
document.addEventListener("click",function(e){
  var c=e.target.closest("#pgrid .pcl");
  if(c){bkF=+c.getAttribute("data-pi");renderBooks();var t=document.querySelector('[data-k="bk_title"]');if(t)t.scrollIntoView({behavior:"smooth",block:"start"});return}
  if(e.target.id==="bkall"){bkF=null;renderBooks();}
});
document.addEventListener("click",function(e){
  if(e.target.id!=="cpy")return;var b=e.target,v="0776950405",d=T[lang];
  function ok(){b.textContent=d.ch_copied;setTimeout(function(){b.textContent=d.ch_copy},1800)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(v).then(ok,function(){fb()})}else fb();
  function fb(){var t=document.createElement("textarea");t.value=v;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();try{document.execCommand("copy");ok()}catch(x){}document.body.removeChild(t)}
});
document.addEventListener("keydown",function(e){var c=e.target.closest&&e.target.closest("#pgrid .pcl");if(c&&(e.key==="Enter"||e.key===" ")){e.preventDefault();c.click()}});
(function(){var q=document.getElementById("q");if(!q)return;
  function done(e){if(e)e.preventDefault();q.blur();var l=document.getElementById("fcount");if(l)l.scrollIntoView({behavior:"smooth",block:"start"})}
  q.addEventListener("keydown",function(e){if(e.key==="Enter"||e.keyCode===13)done(e)});
  q.addEventListener("search",function(){q.blur()});
  var f=q.closest("form");if(f)f.addEventListener("submit",done);
})();
function renderExtra(){
  (function(){var d=T[lang];$("chinfo").innerHTML='<div><b>'+esc(d.ch_i1)+'</b><span class="req"><span class="bank">Мбанк</span><span class="rn">Абдишүкүр Ч.</span><span class="rph">0776 95 04 05</span><button type="button" class="cpy" id="cpy">'+esc(d.ch_copy)+'</button></span></div>'})();
  renderVideos();renderBooks();
  var d=T[lang];
  $("docsblock").innerHTML='<div class="docs"><h3>'+esc(d.docs_h)+'</h3><ol class="dl">'+d.docs.map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ol></div>';
  $("cinfo").innerHTML='<div><b>'+esc(d.k_addr)+'</b><span>'+esc(d.k_addr_v)+'</span></div><div><b>'+esc(d.k_adm)+'</b><span>'+tel("0500 557 556")+tel("0505 44 77 66")+'</span></div>';
  updAsk();
}
function setThemeIcon(){
  var dark=document.documentElement.getAttribute("data-theme")==="dark"||(!document.documentElement.getAttribute("data-theme")&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
  $("theme").innerHTML=dark?'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>':'<svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>';
  $("theme").setAttribute("aria-label",dark?"Light":"Dark");
}
function renderText(){
  var d=T[lang];
  document.documentElement.lang=lang;
  $("demo").textContent=d.demo;$("bs").textContent=d.bs;$("foot").textContent=d.foot;
  document.querySelectorAll("[data-k]").forEach(function(e){var v=d[e.getAttribute("data-k")];if(v!=null)e.textContent=v});
  document.querySelectorAll("[data-ph]").forEach(function(e){e.placeholder=d[e.getAttribute("data-ph")]});
  document.querySelectorAll(".lang button").forEach(function(b){b.className=b.getAttribute("data-l")===lang?"on":""});
  document.title=d.bs+" · Аль-Фуркон";
  renderLists();renderFatwas();renderBanner();renderExtra();setThemeIcon();
}
var VIEWS=["home","fatwas","ask","programs","teachers","branches","charity","contact"];
function route(){
  var h=location.hash.replace("#","");if(VIEWS.indexOf(h)<0)h="home";
  VIEWS.forEach(function(v){$("v-"+v).className="view"+(v===h?" on":"")});
  document.querySelectorAll("#nav a").forEach(function(a){a.className=a.getAttribute("data-v")===h?"on":""});
  var on=document.querySelector('#nav a.on');if(on&&on.scrollIntoView)on.scrollIntoView({inline:"center",block:"nearest"});
  window.scrollTo(0,0);
}
function askUrl(){
  var d=T[lang],q=$("qq").value.trim(),nm=$("qn").value.trim();
  var msg=d.q_msg+"\n\n"+(nm?d.q_l_name+": "+nm+"\n":"")+d.q_l_q+":\n"+q;
  return "https://wa.me/"+WA+"?text="+encodeURIComponent(msg);
}
function updAsk(){var s=$("qs");if(s)s.href=askUrl()}
$("qq").addEventListener("input",updAsk);$("qn").addEventListener("input",updAsk);
$("qs").addEventListener("click",function(e){
  var d=T[lang];updAsk();
  if($("qq").value.trim().length<5){e.preventDefault();$("qe").textContent=d.q_err;$("qq").focus();return}
  $("qe").textContent="";
});
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.hasAttribute("data-l")){lang=b.getAttribute("data-l");try{localStorage.setItem("lang",lang)}catch(x){}renderText();return}
  if(b.classList.contains("chip")){topic=b.getAttribute("data-t");shown=PAGE;renderFatwas();return}
  if(b.id==="more"){shown+=PAGE;renderFatwas();return}
  if(b.hasAttribute("data-bi")){bi=+b.getAttribute("data-bi");renderBanner();return}
  if(b.id==="theme"){
    var de=document.documentElement,cur=de.getAttribute("data-theme");
    if(!cur)cur=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
    var nx=cur==="dark"?"light":"dark";de.setAttribute("data-theme",nx);
    try{localStorage.setItem("theme",nx)}catch(x){}
    setThemeIcon()
  }
});
$("q").addEventListener("input",function(){shown=PAGE;renderFatwas()});
window.addEventListener("hashchange",route);
try{var st=localStorage.getItem("theme");if(st==="dark"||st==="light")document.documentElement.setAttribute("data-theme",st)}catch(e){}
renderText();route();
})();
</script>
